[package]
name = "utsim-viewer"
description = "Read-only 3D viewer that animates a recorded UTSim replay"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"

[lib]
name = "utsim_viewer"
path = "src/lib.rs"

[[bin]]
name = "utsim-view"
path = "src/main.rs"

[dependencies]
utsim-core.workspace = true
utsim-model.workspace = true
utsim-edit.workspace = true
utsim-flow.workspace = true
utsim-fluid.workspace = true
utsim-scene.workspace = true
utsim-assets.workspace = true
utsim-look.workspace = true
utsim-script.workspace = true
utsim-opt.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
ron.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "png"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
# Charts of the "Resultados" area; 0.37 is the release built on egui 0.36 (bevy_egui 0.43).
egui_plot = { version = "=0.37.0", default-features = false }

# Browser build (RF-109): WebGL2 through Bevy's `webgl2` feature (works in every current
# browser; WebGPU is not yet universal). The entry point is `src/web.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "png", "webgl2"] }
wasm-bindgen.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Ícone da janela (src/icon.rs): só no aplicativo de mesa.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "0.30", default-features = false }
png = "0.18"
