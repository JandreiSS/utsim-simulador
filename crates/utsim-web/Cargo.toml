[package]
name = "utsim-web"
description = "UTSim in the browser: WebAssembly bindings (run, validate, fit, replay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `cdylib` is what wasm-bindgen turns into the .wasm; `rlib` lets the plain Rust
# functions in `api` be unit-tested natively.
crate-type = ["cdylib", "rlib"]

[features]
# Native builds (cargo test --workspace) get rayon through the other crates anyway;
# the wasm build (`-p utsim-web`) leaves it off: replications run sequentially.
parallel = ["utsim-model/parallel"]

[dependencies]
utsim-core.workspace = true
utsim-model = { workspace = true, default-features = false }
utsim-fit.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
