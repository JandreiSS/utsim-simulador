[package]
name = "utsim-emu"
description = "Emulation of UTSim models over OPC UA (virtual commissioning)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
utsim-core.workspace = true
utsim-model.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
async-opcua = { version = "0.19", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
async-opcua = { version = "0.19", features = ["server", "client"] }
