[package]
name = "utsim-cli"
description = "Command-line runner for UTSim models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "utsim"
path = "src/main.rs"

[dependencies]
utsim-core.workspace = true
utsim-model.workspace = true
utsim-edit.workspace = true
utsim-diagram.workspace = true
utsim-scene = { workspace = true, features = ["server"] }
utsim-fit.workspace = true
utsim-stats.workspace = true
utsim-quality.workspace = true
utsim-qualidade-core.workspace = true
utsim-exposicao.workspace = true
utsim-opt.workspace = true
utsim-emu.workspace = true
utsim-pert.workspace = true
utsim-dash.workspace = true
utsim-twin.workspace = true
utsim-cad.workspace = true
utsim-linhas.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
