[package]
name = "utsim-godot"
description = "GDExtension bridge: loads, runs and plays UTSim models inside the Godot interface"
version.workspace = true
edition.workspace = true
# egui 0.36 (the interface around the 3D view) needs Rust 1.95.
rust-version = "1.95"

[lib]
name = "utsim_godot"
# cdylib: the library Godot loads; rlib: so the pure modules are unit-tested and linted
# like any crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
utsim-core.workspace = true
utsim-model.workspace = true
utsim-scene.workspace = true
utsim-assets.workspace = true
utsim-edit.workspace = true
utsim-fit.workspace = true
utsim-look.workspace = true
utsim-flow.workspace = true
utsim-opt.workspace = true
utsim-pert.workspace = true
utsim-stats.workspace = true
serde_json.workspace = true
serde.workspace = true
ron.workspace = true
utsim-ui-tema.workspace = true
# The interface around the 3D view is egui, drawn by the bridge (`egui_*`, `ui_class`): the
# workspace's single egui (the launcher's eframe 0.36.2, the viewer's bevy_egui 0.43).
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
# Only the core classes are generated (no `__codegen-full`): the bridge returns plain data
# (dictionaries and packed arrays) and every node is built in GDScript, which keeps the
# build short. `api-4-7` matches Godot 4.7; GDExtension is forward compatible.
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }
