; Presets de exportação da interface 3D do UTSim (fase G5).
; Exportar com scripts/godot_exportar.sh (compila a ponte em release, importa e exporta).
; Os modelos .glb (importados em godot/importados/) entram no .pck; a biblioteca da ponte
; (utsim_godot.dll / libutsim_godot.so) é copiada pelo Godot ao lado do executável.
; Android/Quest: ainda sem preset (precisa do NDK e de uma ponte para aarch64), ver
; docs/plano_godot.md.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="testes/*, capturas/*, export_presets.cfg"
export_path="../target/godot-export/windows/utsim-3d.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon="../assets/icone/utsim.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Projeto UTSim"
application/product_name="UTSim 3D"
application/file_description="UTSim 3D (prévia)"
application/copyright="Copyright (C) 2026 Jandrei"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

[preset.1]

name="Linux"
platform="Linux"
